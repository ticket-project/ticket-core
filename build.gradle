import net.ltgt.gradle.errorprone.CheckSeverity

plugins {
    id 'java'
    alias(libs.plugins.spotless)
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    // 정적 분석: Error Prone을 javac plugin으로 붙이고 그 위에서 NullAway를 돌린다.
    // 실제 검사 범위와 강도는 아래 "정적 분석" 절이 정한다.
    alias(libs.plugins.errorprone)
    alias(libs.plugins.nullaway)
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'seed/src/**/*.java'
        palantirJavaFormat(libs.versions.palantir.java.format.get()).style('PALANTIR').formatJavadoc(true)
        removeUnusedImports()
        importOrder('java', 'javax', 'jakarta', 'org', 'com', '')
        forbidWildcardImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        target '*.gradle', 'gradle/*.gradle', '*.md', '*.toml', '*.yaml', '*.yml', '.editorconfig',
                'docs/**/*.md', '.github/**/*.md', '.github/**/*.yaml', '.github/**/*.yml',
                'scripts/**/*.sh', 'scripts/**/*.cmd'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

group = "${property('projectGroup')}"
version = "${property('applicationVersion')}"

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencyManagement {
    imports {
        mavenBom libs.spring.modulith.bom.get().toString()
    }
}

dependencies {
    // Spring Modulith
    implementation libs.spring.modulith.starter.jpa
    runtimeOnly libs.spring.modulith.starter.insight
    testImplementation libs.spring.modulith.starter.test

    // Web / API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation libs.springdoc.openapi.starter.webmvc.ui

    // 실행 환경
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson
    runtimeOnly 'org.flywaydb:flyway-database-oracle'
    // prod는 Oracle, local/dev는 H2 file DB를 쓴다.
    runtimeOnly libs.bundles.oracle.jdbc
    runtimeOnly 'com.h2database:h2'

    // Data / Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation libs.p6spy.spring.boot.starter
    implementation libs.jjwt.api
    implementation variantOf(libs.querydsl.jpa) { classifier('jakarta') }

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation libs.redisson.spring.boot.starter

    annotationProcessor variantOf(libs.querydsl.apt) { classifier('jakarta') }
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Null 계약 표기. 버전은 Spring Boot BOM이 관리한다(4.1.1 -> jspecify 1.0.1) -- Spring
    // Framework 7 자신이 JSpecify로 표기돼 있어 이미 compile classpath에 올라와 있지만,
    // 우리 코드가 직접 import하므로 명시적 의존으로 선언한다.
    implementation 'org.jspecify:jspecify'

    // javac plugin으로만 쓰인다. 산출물이나 테스트 classpath에 올라가지 않는다.
    errorprone libs.error.prone.core
    errorprone libs.nullaway

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // ApiSecurityConfigTest 등 @WebMvcTest가 실제 Security filter chain을 MockMvc에 적용하려면
    // spring-security-test가 classpath에 있어야 한다(@ConditionalOnClass로 SecurityMockMvcConfigurer가
    // 자동 등록된다). 테스트 코드가 직접 import하지 않아도 지우면 안 된다.
    testImplementation 'org.springframework.boot:spring-boot-security-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation libs.archunit.junit5
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // Oracle 방언 migration을 실제 Oracle(gvenzl/oracle-free 컨테이너)에서 검증한다.
    testImplementation 'org.testcontainers:testcontainers-oracle-free'
    // registry(EVENT_PUBLICATION/EVENT_PUBLICATION_ARCHIVE) DDL을 실제 엔티티 매핑으로 검증한다.
    testCompileOnly 'org.springframework.modulith:spring-modulith-events-jpa'
    // module-aware Flyway 분기(SpringModulithFlywayMigrationStrategy)를 실제 운영과 같은 class로
    // 검증한다. 둘 다 spring-modulith-starter-jpa가 runtime scope로 이미 가져오는 module이다.
    testCompileOnly 'org.springframework.modulith:spring-modulith-runtime'
    // /actuator/modulith endpoint 빈과 module observability(AOP 계측) 빈이
    // 실제로 등록되는지를 타입으로 확인한다. 둘 다 spring-modulith-starter-insight가 runtime
    // scope로 이미 가져오는 module이다.
    testCompileOnly 'org.springframework.modulith:spring-modulith-actuator'
    testCompileOnly 'org.springframework.modulith:spring-modulith-observability-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

/**
 * 정적 분석: Error Prone + NullAway.
 *
 * 이 저장소가 Error Prone에서 원하는 것은 <b>null 계약 검증</b> 하나다. Error Prone이 기본으로 켜는
 * 수백 개의 rule을 한꺼번에 들이면 이번 작업과 무관한 지적이 빌드를 막는다. 그래서 전체를 끈 뒤
 * 필요한 것만 되켠다.
 *
 *   - NullAway            ERROR  -- 빌드를 막는다. null 계약 위반은 CI 실패다.
 *   - 그 외 소수의 rule    WARN   -- 실수는 알려주되 막지 않는다.
 *
 * NullAway는 {@code onlyNullMarked = true}라서 {@code @NullMarked} package만 검사한다. test와 seed
 * source set에는 {@code @NullMarked}가 없어 검사해도 아무 일이 없고 컴파일만 느려지므로 아예 끈다 --
 * 검사 대상은 {@code src/main/java}의 production code다.
 *
 * {@code jspecifyMode = true}는 JSpecify의 generic/type-use 의미(예: {@code List<@Nullable String>})
 * 까지 본다. JDK 25 + NullAway 0.14에서 실제로 켜고 빌드해 확인했다.
 */
tasks.withType(JavaCompile).configureEach {
    options.errorprone.enabled = false
}

tasks.named('compileJava') {
    options.errorprone {
        // 위 configureEach가 전부 껐다. production 컴파일에서만 다시 켠다.
        enabled = true
        // 기본 rule 전체를 끄고 아래에서 필요한 것만 되켠다.
        disableAllChecks = true
        // 실수하기 쉽고 오탐이 적은 것만 경고로 남긴다. 빌드를 막지 않는다.
        warn('MissingOverride', 'EqualsHashCode', 'ReturnValueIgnored', 'UnusedVariable')
        // Querydsl Q-type과 Lombok 산출물은 우리가 고칠 수 있는 코드가 아니다.
        disableWarningsInGeneratedCode = true
        excludedPaths = '.*/build/generated/.*'

        nullaway {
            // NullAway의 severity는 여기서 정한다. errorprone 쪽 error('NullAway')로 정하면
            // nullaway plugin이 뒤에 붙이는 -Xep:NullAway가 그것을 기본값(WARN)으로 되돌린다.
            severity = CheckSeverity.ERROR
            // @NullMarked가 붙은 package만 검사한다. 표기 없는 코드는 판단하지 않는다.
            onlyNullMarked = true
            // JSpecify의 type-use/generic 의미까지 본다.
            jspecifyMode = true
            // 생성자가 아니라 프레임워크가 채우는 필드다. NullAway는 그 시점을 볼 수 없어
            // "생성자에서 초기화되지 않았다"고 보고하는데, 그 보고가 맞지 않는 자리만 최소로 적는다.
            // 클래스 전체를 빼지 않는다 -- 같은 entity의 진짜 nullable 컬럼은 계속 검사받아야 한다.
            //   @Id/@GeneratedValue  -- persistence provider가 flush 시점에 채운다
            //   @Version             -- Hibernate가 채우고 관리한다
            //   @Autowired/@Value    -- Spring 주입
            //   @DefaultValue        -- @ConfigurationProperties 바인딩
            excludedFieldAnnotations = [
                    'jakarta.persistence.Id',
                    'jakarta.persistence.GeneratedValue',
                    'jakarta.persistence.Version',
                    'org.springframework.beans.factory.annotation.Autowired',
                    'org.springframework.beans.factory.annotation.Value',
                    'org.springframework.boot.context.properties.bind.DefaultValue',
            ]
            // 클래스 전체를 검사 대상에서 빼는 유일한 경우: 도구가 만든 코드다.
            excludedClassAnnotations = ['javax.annotation.processing.Generated']
        }
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// 시드 source set, 의존성, 실행·검증 task는 따로 둔다.
apply from: 'gradle/seed.gradle'
