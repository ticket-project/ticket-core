plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.9.0'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java', 'seed/src/**/*.java'
        googleJavaFormat('1.30.0').aosp()
        removeUnusedImports()
        importOrder('java', 'javax', 'jakarta', 'org', 'com', '')
        forbidWildcardImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'misc', {
        target '*.gradle', '*.md', '*.toml', '*.yaml', '*.yml', '.editorconfig',
                'docs/**/*.md', '.github/**/*.md', '.github/**/*.yaml', '.github/**/*.yml',
                'scripts/**/*.sh', 'scripts/**/*.cmd'
        targetExclude 'docs/plans/**'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

group = "${property('projectGroup')}"
version = "${property('applicationVersion')}"

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// 시드는 서비스와 별개의 source set이다. 서비스 main에 섞으면 (1) bootJar에 시드 실행 코드와
// 1MB가 넘는 시드 SQL이 들어가고 (2) Spring Modulith가 시드를 업무 모듈로 다시 탐지한다.
// seedMain 산출물은 main/test 어느 classpath에도 올리지 않는다 -- 의존 방향은 seedTest -> main
// 한쪽뿐이다(테스트가 실제 앱 entity로 스키마를 만들기 위해서다).
sourceSets {
    seedMain {
        java.srcDirs = ['seed/src/main/java']
        resources.srcDirs = []
    }
    seedTest {
        java.srcDirs = ['seed/src/test/java']
        resources.srcDirs = ['seed/src/test/resources']
    }
}

configurations {
    // 시드 테스트는 서비스의 의존성 집합을 그대로 물려받는다. 실제 앱 entity 매핑으로 스키마를
    // 만들어 검증하기 때문이다(Hibernate/JPA가 필요하다). seedMain은 물려받지 않는다.
    seedTestImplementation.extendsFrom seedMainImplementation, implementation
    seedTestRuntimeOnly.extendsFrom seedMainRuntimeOnly, runtimeOnly
}

dependencyManagement {
    imports {
        mavenBom libs.spring.modulith.bom.get().toString()
    }
}

dependencies {
    // Spring Modulith
    implementation libs.spring.modulith.starter.jpa
    runtimeOnly libs.spring.modulith.starter.insight
    testImplementation libs.spring.modulith.starter.test

    // Web / API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation libs.springdoc.openapi.starter.webmvc.ui

    // 실행 환경
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson
    runtimeOnly 'org.flywaydb:flyway-database-oracle'
    // prod/dev는 Oracle, local/test는 h2 파일 DB를 쓴다.
    runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly libs.oracle.security.osdt.cert
    runtimeOnly libs.oracle.security.oraclepki
    runtimeOnly libs.oracle.security.osdt.core

    // Data / Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation libs.p6spy.spring.boot.starter
    implementation libs.jjwt.api
    implementation variantOf(libs.querydsl.jpa) { classifier('jakarta') }
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework.data:spring-data-jpa'

    // 유스케이스 계층에 필요한 최소 Spring
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-beans'
    implementation 'org.slf4j:slf4j-api'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation libs.redisson.spring.boot.starter

    annotationProcessor variantOf(libs.querydsl.apt) { classifier('jakarta') }
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // ActuatorSecurityConfigTest 등 @WebMvcTest + Import(SecurityConfig)가 실제 Security filter chain을
    // MockMvc에 적용하려면 spring-security-test가 classpath에 있어야 한다(@ConditionalOnClass로
    // SecurityMockMvcConfigurer가 자동 등록됨). 코드에서 org.springframework.security.test.*를 직접
    // import하지 않아 겉보기엔 미사용처럼 보이지만 제거하면 해당 테스트의 ApplicationContext 로딩이
    // 깨진다 — 2026-09-02 Task 13에서 실측 확인.
    testImplementation 'org.springframework.boot:spring-boot-security-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation libs.archunit.junit5
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // Task 11 Step 7: 저장소에 Oracle Testcontainers 인프라가 없어 CI에서 Oracle 방언 migration을
    // 실제로 검증할 수 있는 유일한 수단으로 새로 추가한다.
    testImplementation 'org.testcontainers:testcontainers-oracle-free'
    // 제약 위반 원인 예외를 실제 타입으로 만들어 테스트한다. 프로덕션은 쓰지 않는다.
    testImplementation 'org.hibernate.orm:hibernate-core'
    // registry(EVENT_PUBLICATION/EVENT_PUBLICATION_ARCHIVE) DDL을 실제 엔티티 매핑으로 검증한다.
    testCompileOnly 'org.springframework.modulith:spring-modulith-events-jpa'
    // module-aware Flyway 분기(SpringModulithFlywayMigrationStrategy)를 실제 운영과 같은 class로
    // 검증한다. 둘 다 spring-modulith-starter-jpa가 runtime scope로 이미 가져오는 module이다.
    testCompileOnly 'org.springframework.modulith:spring-modulith-runtime'
    // Task 12 Step 4: /actuator/modulith endpoint 빈과 module observability(AOP 계측) 빈이
    // 실제로 등록되는지를 타입으로 확인한다. 둘 다 spring-modulith-starter-insight가 runtime
    // scope로 이미 가져오는 module이다.
    testCompileOnly 'org.springframework.modulith:spring-modulith-actuator'
    testCompileOnly 'org.springframework.modulith:spring-modulith-observability-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Seed (별도 source set) -- 실행에 필요한 최소한만 쓴다. 웹 서버, Redis, OAuth, JPA는 쓰지 않는다.
    seedMainImplementation 'org.springframework:spring-jdbc'
    seedMainImplementation 'org.springframework:spring-tx'
    seedMainImplementation 'org.springframework.security:spring-security-crypto'
    seedMainImplementation 'org.yaml:snakeyaml'
    seedMainRuntimeOnly 'com.h2database:h2'
    // seedProd는 운영 Oracle에 직접 붙는다. 서버(runtimeOnly)가 쓰는 것과 같은 좌표여야 Wallet 기반
    // jdbc:oracle:thin:@<tns_alias> URL과 TNS_ADMIN 설정을 서버와 동일하게 쓸 수 있다.
    seedMainRuntimeOnly 'com.oracle.database.jdbc:ojdbc8'
    seedMainRuntimeOnly libs.oracle.security.osdt.cert
    seedMainRuntimeOnly libs.oracle.security.oraclepki
    seedMainRuntimeOnly libs.oracle.security.osdt.core

    // 시드 테스트는 시드 코드와, 실제 앱 entity 매핑으로 스키마를 만들기 위한 서비스 classpath를
    // 함께 본다. 반대 방향(main/test가 시드를 보는 것)은 만들지 않는다.
    seedTestImplementation sourceSets.seedMain.output
    seedTestImplementation sourceSets.main.output
    seedTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 운영 적재 경로(seedProd)는 실제 Oracle에서만 검증할 수 있다. 서비스 테스트가 이미 쓰는
    // gvenzl/oracle-free 컨테이너를 시드 테스트에서도 쓴다(Docker 없으면 자동으로 건너뛴다).
    seedTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    seedTestImplementation 'org.testcontainers:testcontainers-oracle-free'
    seedTestRuntimeOnly 'com.oracle.database.jdbc:ojdbc8'
    seedTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // CI는 `clean test bootJar`만 돌린다. 시드 테스트가 누락되지 않게 test에 매단다.
    // 좁은 범위만 확인할 때는 `-x seedTest`로 뺀다.
    finalizedBy 'seedTest'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

tasks.register('seedTest', Test) {
    group = 'verification'
    description = '시드 프로그램 테스트를 실행한다.'
    testClassesDirs = sourceSets.seedTest.output.classesDirs
    classpath = sourceSets.seedTest.runtimeClasspath
    useJUnitPlatform()
    // 공용 시드 전체 적재 테스트가 100만 행 가까이 만든다. 임시 H2 파일 DB를 쓰지만 여유를 둔다.
    maxHeapSize = '2g'
    // 시드 프로그램의 출력과 실패 메시지가 한국어다. 리포트가 깨지지 않게 고정한다.
    defaultCharacterEncoding = 'UTF-8'
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    systemProperty 'seed.project-dir', projectDir.absolutePath
}

/**
 * 서비스 배포 산출물에 시드 실행 코드와 시드 데이터가 들어가지 않았는지 실제 jar를 열어 확인한다.
 * source set 분리만으로 보장되지만, jar 구성이 바뀔 때 조용히 새는 것을 막는다.
 */
tasks.register('verifySeedNotInBootJar') {
    group = 'verification'
    description = 'bootJar에 시드 실행 코드와 시드 SQL이 없는지 확인한다.'
    dependsOn tasks.named('bootJar')
    def archive = tasks.named('bootJar').flatMap { it.archiveFile }
    inputs.file(archive)
    doLast {
        def leaked = zipTree(archive.get().asFile).matching {
            include '**/com/ticket/seed/**'
            include '**/seed/*.sql'
            include '**/kopis-curated.sql'
        }.files
        if (!leaked.isEmpty()) {
            throw new GradleException(
                    "bootJar에 시드 산출물이 포함됐다: " + leaked.collect { it.name }.join(', '))
        }
        logger.lifecycle('ok    bootJar에 시드 실행 코드와 시드 SQL이 없다')
    }
}

tasks.named('check') {
    dependsOn 'seedTest'
}

/**
 * 로컬 H2 DB에 초기 데이터를 적재하고 종료한다. 서버 기동과는 별개 명령이다.
 *
 *   .\gradlew.bat seedLocal
 *
 * 접속 설정의 원본은 src/main/resources/application-local.yml이다. 검증용으로 임시 DB를 쓸 때만
 * -Dseed.jdbc-url로 덮어쓴다. seed.* 시스템 프로퍼티는 Gradle JVM에서 실행 JVM으로 넘긴다.
 */
tasks.register('seedLocal', JavaExec) {
    group = 'application'
    description = '로컬 H2 DB에 시드 데이터를 적재한다 (서버 기동 후 실행).'
    mainClass = 'com.ticket.seed.SeedLocalMain'
    classpath = sourceSets.seedMain.runtimeClasspath
    configureSeedExecution(it, project)
}

/**
 * 준비된 운영 Oracle 테이블에 초기 데이터를 적재하고 종료한다. 사용자가 자기 PC에서 직접 실행한다.
 *
 *   .\gradlew.bat seedProd
 *
 * 접속 설정의 원본은 SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
 * 환경변수뿐이다. seedLocal과 달리 application-local.yml을 읽지 않는다 -- 운영 적재가 조용히 로컬
 * H2로 흘러가는 경로를 만들지 않기 위해서다. 세 값 중 하나라도 없으면 적재 전에 실패한다.
 *
 * 기본값은 공연 데이터만 적재한다(테스트 회원 0명, 부하 테스트 회차 0개).
 * 테이블 생성은 이 명령의 범위가 아니다 -- 이미 있는 테이블에 데이터만 넣는다.
 */
tasks.register('seedProd', JavaExec) {
    group = 'application'
    description = '준비된 운영 Oracle 테이블에 시드 데이터를 적재한다 (환경변수로 접속 설정을 넘긴다).'
    mainClass = 'com.ticket.seed.SeedProdMain'
    classpath = sourceSets.seedMain.runtimeClasspath
    configureSeedExecution(it, project)
    // Wallet(자율운영 DB)을 쓰면 ojdbc가 TNS_ADMIN을 본다. 서버와 같은 설정을 그대로 쓸 수 있게
    // 환경변수를 시스템 프로퍼티로도 넘긴다(ojdbc는 둘 다 지원한다).
    if (System.getenv('TNS_ADMIN')) {
        systemProperty 'oracle.net.tns_admin', System.getenv('TNS_ADMIN')
    }
}

/**
 * seedLocal / seedProd 공통 실행 설정. seed.* 시스템 프로퍼티는 Gradle JVM에서 실행 JVM으로 넘긴다.
 * 접속 자격증명은 프로퍼티로 넘기지 않는다 -- 환경변수는 JavaExec가 그대로 상속한다.
 */
static void configureSeedExecution(JavaExec task, Project project) {
    // Gradle이 자식 프로세스 출력을 UTF-8로 읽는다. 시드 프로그램의 한국어 출력이 Windows
    // 콘솔 인코딩(cp949)으로 나가면 그 자리에서 깨진다.
    task.systemProperty 'stdout.encoding', 'UTF-8'
    task.systemProperty 'stderr.encoding', 'UTF-8'
    task.systemProperty 'seed.project-dir', project.projectDir.absolutePath
    System.properties.each { key, value ->
        if (key.toString().startsWith('seed.')) {
            task.systemProperty key.toString(), value
        }
    }
}
