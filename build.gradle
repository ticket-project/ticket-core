plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = "${property('projectGroup')}"
version = "${property('applicationVersion')}"

repositories {
    mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

dependencyManagement {
    imports {
        mavenBom libs.spring.modulith.bom.get().toString()
    }
}

dependencies {
    // Spring Modulith
    implementation libs.spring.modulith.starter.jpa
    runtimeOnly libs.spring.modulith.starter.insight
    testImplementation libs.spring.modulith.starter.test

    // Web / API
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation libs.springdoc.openapi.starter.webmvc.ui

    // 실행 환경
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson
    runtimeOnly 'org.flywaydb:flyway-database-oracle'
    // prod/dev는 Oracle, local/test는 h2 파일 DB를 쓴다.
    runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly libs.oracle.security.osdt.cert
    runtimeOnly libs.oracle.security.oraclepki
    runtimeOnly libs.oracle.security.osdt.core

    // Data / Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation libs.p6spy.spring.boot.starter
    implementation libs.jjwt.api
    implementation variantOf(libs.querydsl.jpa) { classifier('jakarta') }
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'org.springframework.data:spring-data-jpa'

    // 유스케이스 계층에 필요한 최소 Spring
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-beans'
    implementation 'org.slf4j:slf4j-api'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation libs.redisson.spring.boot.starter

    annotationProcessor variantOf(libs.querydsl.apt) { classifier('jakarta') }
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-security-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'
    testImplementation libs.fixture.monkey.starter
    testImplementation libs.archunit.junit5
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // Task 11 Step 7: 저장소에 Oracle Testcontainers 인프라가 없어 CI에서 Oracle 방언 migration을
    // 실제로 검증할 수 있는 유일한 수단으로 새로 추가한다.
    testImplementation 'org.testcontainers:testcontainers-oracle-free'
    // 제약 위반 원인 예외를 실제 타입으로 만들어 테스트한다. 프로덕션은 쓰지 않는다.
    testImplementation 'org.hibernate.orm:hibernate-core'
    // registry(EVENT_PUBLICATION/EVENT_PUBLICATION_ARCHIVE) DDL을 실제 엔티티 매핑으로 검증한다.
    testCompileOnly 'org.springframework.modulith:spring-modulith-events-jpa'
    // module-aware Flyway 분기(SpringModulithFlywayMigrationStrategy)를 실제 운영과 같은 class로
    // 검증한다. 둘 다 spring-modulith-starter-jpa가 runtime scope로 이미 가져오는 module이다.
    testCompileOnly 'org.springframework.modulith:spring-modulith-runtime'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
