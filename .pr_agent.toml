[config]
response_language = "ko-KR"
ignore_pr_title = ["^WIP", "^\\[WIP\\]", "^\\[skip qodo\\]"]
ignore_pr_labels = ["skip-qodo", "skip-ai-review"]
allow_only_specific_folders = ["src", "docs", ".github"]
patch_extra_lines_before = 8
patch_extra_lines_after = 5

[github_app]
pr_commands = ["/agentic_describe", "/agentic_review"]

[ignore]
glob = [
  "storage/images/**",
  "**/build/**",
  ".gradle/**",
  ".gradle-user-home/**",
  ".gradle-user-home-hold-fix/**",
  ".tmp/**",
  "mysql-data/**",
  ".idea/**",
  ".backup/**"
]

[pr_reviewer]
require_score_review = true
require_tests_review = true
require_estimate_effort_to_review = true
extra_instructions = """\
- 이 저장소의 규칙은 루트 AGENTS.md와 docs/가 단일 원본입니다. 규칙 판단은 그 문서를 따르세요.
- 모든 요약, 리뷰, 제안은 한국어로 작성하세요.
- 리뷰 기준(패치 밖 관련 코드까지 확인, 스타일보다 결함·회귀·테스트 공백 우선, findings first·심각도 순, 근거 약한 코멘트 금지)은 AGENTS.md의 "코드 리뷰" 절과 같습니다.
- 버그, 동시성 문제, 트랜잭션 경계, 보안, Redis TTL/만료 처리, 분산 락 누락, 회귀 위험, 테스트 공백을 우선 지적하세요.
- DB 트랜잭션 안에서 Redis나 WebSocket을 호출하는 코드, background executor 한도를 늘리는 변경은 특히 엄격하게 보세요.
- controller가 repository를 직접 다루는지, web 계층에 비즈니스 규칙이 들어갔는지, domain 경계를 깨는지 확인하세요.
- booking(hold, order, performanceseat, admission token 검증), member(인증) 변경은 경쟁 상태와 만료 처리 누락을 집중적으로 보세요.
- 점수, 테스트 공백, 보안 우려, 아키텍처 위반 가능성을 빠짐없이 평가하세요.
"""

[review_agent]
comments_location_policy = "both"
inline_comments_severity_threshold = 1
issues_user_guidelines = """\
가능한 한 많은 유효한 피드백을 남기세요.
요약과 인라인을 모두 활용하세요.
문제 제기 시 왜 문제가 되는지와 어떤 조건에서 깨지는지 짧게 설명하세요.
"""
compliance_user_guidelines = """\
이 저장소의 규칙(단일 원본: 루트 AGENTS.md와 docs/):
- 문서와 기본 응답은 한국어
- 변경은 수술적으로, 요청 범위만 수정
- 단순함 우선, 불필요한 추상화 금지
- 계층별 책임과 포트 소유(web/application/domain/infrastructure 배치, domain 패키지 순수성 포함)는
  docs/architecture.md의 "Module Structure" 절을 따른다
"""

[pr_code_suggestions]
enable_chat_in_code_suggestions = true
