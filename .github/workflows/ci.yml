name: Pull Request CI

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check agent docs structure
        run: bash scripts/check-docs.sh

  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # KOPIS 수집 도구의 회귀 테스트. 네트워크를 타지 않고, 병합 지점 검증은 실제
      # seed/sql/kopis-curated.sql을 대상으로 한다. 외부 의존성이 없어 설치 단계가 없다.
      - name: Test seed collection tool
        run: node --test "seed/kopis/*.test.mjs"

      # test는 seedTest(seed/ 소스 집합)를 finalizedBy로 함께 돌린다.
      # verifySeedNotInBootJar는 실제 bootJar를 열어 시드 산출물이 섞이지 않았는지 확인한다.
      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew clean spotlessCheck test bootJar verifySeedNotInBootJar --no-daemon

      - name: Upload Spring Modulith structure docs
        uses: actions/upload-artifact@v4
        with:
          name: spring-modulith-docs
          path: build/spring-modulith-docs/
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified application jar
        uses: actions/upload-artifact@v4
        with:
          name: ticket-core-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
