name: Pull Request CI

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check agent docs structure
        run: bash scripts/check-docs.sh

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew clean test bootJar --no-daemon

      - name: Upload Spring Modulith structure docs
        uses: actions/upload-artifact@v4
        with:
          name: spring-modulith-docs
          path: build/spring-modulith-docs/
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified application jar
        uses: actions/upload-artifact@v4
        with:
          name: ticket-core-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
