name: Pull Request CI

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
  workflow_call:

# PR은 새 커밋이 오면 이전 실행을 취소한다. 배포 workflow가 workflow_call로 부르는 실행과 수동 실행은 서로
# 취소하지 않게 group을 workflow 이름으로 나누고, 취소는 PR 이벤트에서만 한다. 호출된 workflow에서
# github.workflow와 github.event_name은 호출한 쪽(배포 workflow, push) 값이다.
concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check agent docs structure
        run: bash scripts/check-docs.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Redis·PostgreSQL이 필요한 테스트는 Testcontainers로 직접 띄운다(Docker는 러너에 있다). 서비스 컨테이너를 따로 두지 않는다.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # 아래 node --test에 glob을 넘기려면 Node 21 이상이 필요하다. 러너 이미지가 바뀌어도 같은 Node로 돌도록
      # 버전을 고정한다. package.json이 없어 의존성 캐시는 쓰지 않는다.
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # KOPIS 수집 도구의 회귀 테스트. 네트워크를 타지 않고, 병합 지점 검증은 실제
      # seed/sql/kopis-curated.sql을 대상으로 한다. 외부 의존성이 없어 설치 단계가 없다.
      - name: Test seed collection tool
        run: node --test "seed/kopis/*.test.mjs"

      # architectureTest(구조 테스트, DB·Docker 불필요)를 test보다 먼저 돌려 구조 위반이면 전체 테스트를
      # 기다리지 않고 멈춘다. 명령줄 순서대로 실행되고 실패하면 뒤 task는 돌지 않는다.
      # seedTest(seed/ 소스 집합)는 test와 별개 task라 명시해서 돌린다.
      # verifySeedNotInBootJar는 실제 bootJar를 열어 시드 산출물이 섞이지 않았는지 확인한다.
      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew clean spotlessCheck compileJava architectureTest test seedTest bootJar verifySeedNotInBootJar --no-daemon

      - name: Upload Spring Modulith structure docs
        uses: actions/upload-artifact@v7
        with:
          name: spring-modulith-docs
          path: build/spring-modulith-docs/
          if-no-files-found: error
          retention-days: 7

      - name: Upload verified application jar
        uses: actions/upload-artifact@v7
        with:
          name: ticket-core-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
