name: Backend CI/CD (Docker Hub)

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: deploy-ticket-be
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-and-deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download verified application jar
        uses: actions/download-artifact@v4
        with:
          name: core-api-jar
          path: core/core-api/build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ticket-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ secrets.DOCKER_USERNAME }}/ticket-be:${{ github.sha }}"
            DEPLOY_DIR="/home/ubuntu"
            CURRENT_FE_IMAGE="$(sudo docker inspect ticket-fe --format '{{.Config.Image}}' 2>/dev/null || true)"

            if [ -z "$CURRENT_FE_IMAGE" ]; then
              CURRENT_FE_IMAGE="${{ secrets.DOCKER_USERNAME }}/ticket-fe:latest"
              sudo docker pull "$CURRENT_FE_IMAGE"
            fi

            echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            sudo docker pull "$IMAGE"
            sudo DOCKER_IMAGE="$IMAGE" FRONTEND_DOCKER_IMAGE="$CURRENT_FE_IMAGE" DD_VERSION="${{ github.sha }}" \
              docker compose -f "$DEPLOY_DIR/docker-compose.yml" up -d --remove-orphans
            sudo docker restart ticket-nginx
            sudo docker image prune -f
