# ticket 로컬 실행 환경: PostgreSQL, Redis, Core. 모두 Docker 네트워크 ticket에 있다.
#
# 개발할 때는 DB와 Redis만 띄우고 Core는 IDE나 bootRun으로 띄운다.
#   docker compose -f docker-compose-local.yml up -d postgres redis
# 부하 측정처럼 Core도 컨테이너로 띄울 때는 먼저 bootJar를 만든다.
#   .\gradlew.bat bootJar
#   docker compose -f docker-compose-local.yml up -d --build --wait
#
# Core 컨테이너는 같은 네트워크에서 postgres·redis라는 이름으로 접속한다. Windows에서 띄운 Core는 쿼리마다
# Docker 포트 중계를 지나는데, 부하 측정에서 그 중계가 병목이었다(gatling-test docs/capacity-log P-008).
# 호스트 포트 5432·6379는 다른 프로젝트의 PostgreSQL·Redis와 겹칠 수 있다. 겹치면 그쪽을 멈추고 띄운다.
#
# Datadog으로 볼 때만 Agent를 함께 띄우고 Core 트레이서를 켠다(평소에는 둘 다 꺼져 있다).
#   $env:CORE_JAVA_TOOL_OPTIONS = "-javaagent:/opt/datadog/dd-java-agent.jar"
#   docker compose -f docker-compose-local.yml up -d --wait core datadog-agent
# API 키와 사이트는 워크스페이스 local-env/datadog.env(DD_API_KEY, DD_SITE)에 둔다. 이 파일에 키를 넣지 않는다.
# 트레이서는 Core CPU와 메모리 할당을 늘린다. 부하 측정에서 켠 실행과 끈 실행의 숫자를 섞어 비교하지 않는다.
name: ticket

services:
  postgres:
    image: postgres:18
    container_name: ticket-postgres
    environment:
      POSTGRES_DB: ticket
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    labels:
      # Datadog Agent가 떠 있을 때만 쓰는 PostgreSQL 수집 설정. 계정은 위의 로컬 계정이다.
      com.datadoghq.ad.checks: '{"postgres": {"instances": [{"host": "%%host%%", "port": 5432, "username": "ticket", "password": "ticket_local", "dbname": "ticket", "reported_hostname": "ticket-postgres", "tags": ["env:local"], "collect_activity_metrics": true}]}}'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: ticket-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build: .
    image: ticket-core:local
    container_name: ticket-core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # JWT·OAuth 같은 로컬 비밀값. 워크스페이스의 local-env에 있고 git이 추적하지 않는다.
    env_file: ../local-env/ticket-core.env
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # SQL 로그(p6spy)는 측정을 느리게 하므로 끈다.
      DECORATOR_DATASOURCE_ENABLED: "false"
      # 값 없음: compose를 실행한 셸에 있으면 그 값을 넘기고, 없으면 Hikari 기본값(10)을 쓴다. 풀 크기 실험용.
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:
      # 셸의 CORE_JAVA_TOOL_OPTIONS에 -javaagent가 있을 때만 이미지 안의 dd-java-agent(Datadog 트레이서)가 켜진다.
      # 셸에 JAVA_TOOL_OPTIONS를 직접 두면 그 창의 Windows Java(Gradle 등)도 읽어 깨지므로 이름을 나눈다.
      JAVA_TOOL_OPTIONS: ${CORE_JAVA_TOOL_OPTIONS:-}
      DD_AGENT_HOST: datadog-agent
      DD_PROFILING_ENABLED: "true"
      # Clock은 Asia/Seoul로 고정돼 있지만 JPA 감사 시각은 JVM 기본 시간대를 따른다.
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 60

  datadog-agent:
    # 이름으로 지정하거나 --profile datadog을 줄 때만 뜬다.
    profiles: ["datadog"]
    image: gcr.io/datadoghq/agent:7
    container_name: ticket-datadog-agent
    env_file:
      - path: ../local-env/datadog.env
        required: false
    environment:
      DD_HOSTNAME: ticket-local
      DD_ENV: local
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      # Core 트레이서가 보내는 JVM 지표(DogStatsD)를 다른 컨테이너에서 받는다.
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro

volumes:
  postgres-data:

networks:
  default:
    name: ticket
