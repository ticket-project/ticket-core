spring:
  application:
    name: ticket-core
  datasource:
    hikari:
      pool-name: ticket-core
  config:
    import:
      - logging.yml
      - redis.yml
  http:
    serviceclient:
      kakao:
        base-url: https://kapi.kakao.com
        connect-timeout: 5s
        read-timeout: 3s
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/oauth2/callback/{registrationId}"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
            provider: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    locations: classpath:db/migration
    encoding: UTF-8
    clean-disabled: true
    validate-on-migrate: true

server:
  forward-headers-strategy: framework
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: ${DD_SERVICE:ticket-core}
      environment: ${DD_ENV:local}
      version: ${DD_VERSION:unknown}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s,3s,5s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s

springdoc:
  use-fqn: true
  default-consumes-media-type: application/json;charset=UTF-8
  default-produces-media-type: application/json;charset=UTF-8

  api-docs:
    path: /api/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    enabled: true
    display-request-duration: true
    operations-sorter: alpha
    persist-authorization: true
    filter: true
    url: /api/api-docs

security:
  jwt:
    issuer: ticket
    secret-key: ${JWT_SECRET}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS}
  admission:
    enforcement-enabled: ${ADMISSION_TOKEN_ENFORCEMENT_ENABLED:false}
    issuer: ${ADMISSION_TOKEN_ISSUER:ticket-queue}
    audience: ${ADMISSION_TOKEN_AUDIENCE:ticket-api}
    secret-key: ${ADMISSION_TOKEN_SECRET_KEY:0123456789abcdef0123456789abcdef}
    expiration-seconds: ${ADMISSION_TOKEN_EXPIRATION_SECONDS:300}

# background worker(스케줄러, outbox relay) 실행 여부.
# false면 같은 실행 모듈이 API만 제공한다.
worker:
  enabled: ${WORKER_ENABLED:true}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  seed:
    enabled: false
    batch-size: 500
    load-test-fixture:
      enabled: false
      performance-count: 8
  auth:
    frontend:
      local-base-url: ${APP_AUTH_FRONTEND_LOCAL_BASE_URL:http://localhost:3000}
      prod-base-url: ${APP_AUTH_FRONTEND_PROD_BASE_URL:https://oneticket.site}
    public-base-url: ${APP_AUTH_PUBLIC_BASE_URL:http://localhost:8080}
    oauth2-success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI}
    oauth2-failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI}
    oauth2-success-redirect-path: ${APP_AUTH_OAUTH2_SUCCESS_REDIRECT_PATH:/auth/callback}
    oauth2-failure-redirect-path: ${APP_AUTH_OAUTH2_FAILURE_REDIRECT_PATH:/auth/callback}
    kakao:
      admin-key: ${KAKAO_ADMIN_KEY}
