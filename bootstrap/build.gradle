tasks.named('bootJar') {
    enabled = true
}

tasks.named('jar') {
    enabled = false
}

dependencies {
    // composition root: API/App/Infra를 한 프로세스로 조립한다.
    implementation project(':core:core-api')
    implementation project(':core:core-app')
    implementation project(':core:core-infra')
    implementation project(':support:error')
    implementation project(':support:logging')

    // 실행 환경 의존성은 실행 모듈이 소유한다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson
    runtimeOnly 'org.flywaydb:flyway-database-oracle'
    // prod/dev는 Oracle, local/test는 h2 파일 DB를 쓴다. DB 드라이버는 실행 모듈이 소유한다.
    runtimeOnly 'com.oracle.database.jdbc:ojdbc8'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly libs.oracle.security.osdt.cert
    runtimeOnly libs.oracle.security.oraclepki
    runtimeOnly libs.oracle.security.osdt.core

    testImplementation libs.archunit.junit5
    // 실행 컨텍스트가 실제로 조립되는지 확인한다. Redis가 필요해 integrationTest로 분리한다.
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

sourceSets {
    integrationTest {
        // srcDir을 다시 선언하지 않는다. Gradle이 source set 이름으로 src/integrationTest/java와
        // src/integrationTest/resources를 이미 잡는다. 중복 선언하면 리소스가 두 번 복사되어
        // processIntegrationTestResources가 duplicate로 실패한다.
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.register('integrationTest', Test) {
    description = 'Boots the whole application context against real infrastructure.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')
}

tasks.named('check') {
    dependsOn tasks.named('integrationTest')
}

// integrationTest는 실제 서블릿 컨테이너를 띄우고 HTTP로 두드린다. 그래서 web 타입과
// TestRestTemplate이 컴파일 클래스패스에 필요하다. 단위 테스트에는 필요 없으므로
// testImplementation이 아니라 이 source set에만 둔다.
// Spring Boot 4에서 TestRestTemplate은 spring-boot-resttestclient로 분리됐다.
dependencies {
    integrationTestImplementation 'org.springframework.boot:spring-boot-starter-web'
    integrationTestImplementation 'org.springframework.boot:spring-boot-resttestclient'
    // Redis 상태를 테스트가 직접 비운다. storage:redis-core가 api로 노출한다.
    integrationTestImplementation project(':storage:redis-core')
}
