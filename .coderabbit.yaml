# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: ko-KR
tone_instructions: >
  모든 리뷰, 요약, 제안은 한국어로 작성하세요.
  리뷰 기준(패치 밖 관련 코드·테스트·설정까지 확인, 스타일보다 결함 가능성 우선, 근거 약한 코멘트 금지)은
  AGENTS.md의 "코드 리뷰" 절과 같습니다. 이 저장소에서는 특히 동시성 문제, 트랜잭션 경계, Redis TTL/만료
  처리, 보안, 테스트 공백을 우선 지적하세요.

reviews:
  profile: assertive
  high_level_summary: true
  high_level_summary_placeholder: "CodeRabbit PR 요약"
  review_status: true
  commit_status: true
  changed_files_summary: true
  sequence_diagrams: true
  collapse_walkthrough: false
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: true
  poem: false
  enable_prompt_for_ai_agents: true
  path_filters:
    - "**/*"
    - "!storage/images/**"
    - "!**/build/**"
    - "!.gradle/**"
    - "!.gradle-user-home/**"
    - "!.gradle-user-home-hold-fix/**"
    - "!.tmp/**"
    - "!mysql-data/**"
    - "!.idea/**"
    - "!.backup/**"
  path_instructions:
    - path: "src/main/java/com/ticket/*/web/**"
      instructions: |
        - Controller, config, security, websocket 계층에서 비즈니스 규칙이나 직접적인 저장소 접근이 섞였는지 집중 확인하세요.
        - 인증/인가 누락, 공개 API 노출, 요청 검증 누락, 응답 스키마 호환성 문제를 우선 찾으세요.
        - 단순 스타일보다 실제 장애 시나리오와 회귀 위험을 중심으로 지적하세요.
    - path: "src/main/java/com/ticket/*/application/**"
      instructions: |
        - 트랜잭션 경계가 use case 안에서 올바르게 시작·종료되는지, 락을 먼저 잡고 그 안에서 트랜잭션을
          시작하는 순서를 지키는지 확인하세요.
        - `UseCase.Input` 검증(필수값·조합·존재 여부·권한·멱등성 판단)이 이 계층 책임과 맞는지 확인하세요.
        - 분산락, 이벤트 발행, 외부 provider 같은 출력 포트 사용이 추상화를 지키고 구현 세부사항을 노출하지
          않는지 확인하세요.
        - 이 계층이 조립하는 domain 규칙과 어긋나거나 domain이 가져야 할 업무 판단을 대신하고 있지 않은지
          확인하세요.
        - 다른 모듈 공개 API를 쓸 때 그 모듈의 내부 예외 타입을 직접 잡지 않는지 확인하세요.
    - path: "src/main/java/com/ticket/*/domain/**"
      instructions: |
        - 이 경로는 가장 엄격하게 심층 리뷰하세요.
        - hold, order, performanceseat(booking 모듈), 인증(member 모듈), admission token 검증(booking 모듈) 등
          도메인의 상태 전이, 동시성, 분산 락, Redis TTL/expiration, scheduler/listener 정합성을 우선 확인하세요.
        - 트랜잭션 경계 오류, 부분 저장, 이벤트 누락, 만료 처리 불일치를 집중적으로 찾으세요.
        - 관련 테스트가 충분한지도 함께 보세요.
    - path: "src/main/java/com/ticket/*/infrastructure/**"
      instructions: |
        - infrastructure는 domain과 application이 정의한 포트(Repository 계약, 분산락·발행·외부 client 등)의
          구현체를 둔다. 업무 판단이나 상태 전이 결정이 섞였는지 확인하세요.
        - Redis 명령과 key 조립, TTL 설정, expiration listener, WebSocket 발행, scheduler, 분산락 AOP를 우선 확인하세요.
        - DB 트랜잭션 안에서 Redis나 WebSocket을 호출하는 코드, background executor 한도를 늘리는 변경은 특히 엄격하게 보세요.
        - Redis key·TTL·전환 절차의 세부 규칙은 docs/operations.md의 "분산락과 Redis 작업 규칙"이 원본입니다.
    - path: ".github/**"
      instructions: |
        - workflow, review 설정, 배포 설정 변경은 CI 실패, 보안 노출, 잘못된 자동화 동작을 중심으로 확인하세요.
    - path: "**/*"
      instructions: |
        - 이 저장소의 규칙은 루트 AGENTS.md와 docs/가 기준입니다. 리뷰 기준은 AGENTS.md의 "코드 리뷰" 절과
          같습니다.
  tools:
    gitleaks:
      enabled: true
    sqlfluff:
      enabled: true
    checkov:
      enabled: true
    yamllint:
      enabled: true
    languagetool:
      enabled: true
      level: picky
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    ignore_title_keywords:
      - "WIP"
      - "[WIP]"
      - "[skip ai]"
      - "[skip review]"
    base_branches:
      - "master"
  finishing_touches:
    docstrings:
      enabled: true
    unit_tests:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: auto
  issues:
    scope: local
  pull_requests:
    scope: local

code_generation:
  docstrings:
    language: ko-KR
    path_instructions:
      - path: "**/*"
        instructions: |
          - 문서와 기본 설명은 한국어로 작성하세요.
          - JavaDoc은 목적, 파라미터, 반환값, 예외를 명확히 적으세요.
  unit_tests:
    path_instructions:
      - path: "**/*"
        instructions: |
          - 새 분기나 회귀 위험이 있는 변경에는 테스트 제안을 적극적으로 포함하세요.
          - Controller는 통합 또는 슬라이스 테스트, 나머지는 단위 테스트를 우선 고려하세요.
