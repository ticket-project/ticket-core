# Core를 이미 실행 중인 PostgreSQL·Redis 컨테이너와 같은 Docker 네트워크에서 띄운다.
# Windows에서 띄운 Core는 쿼리마다 Docker 포트 중계를 지나고, 부하 측정에서 그 중계가 병목이었다
# (gatling-test docs/capacity-log P-008). PostgreSQL·Redis는 여기서 띄우지 않는다(README 로컬 실행).
#
# 기존 컨테이너의 이름·네트워크는 PC마다 다르므로 git이 추적하지 않는 compose.local.env에 적는다.
#   POSTGRES_NETWORK, POSTGRES_HOST  PostgreSQL 컨테이너의 네트워크와 이름
#   REDIS_NETWORK, REDIS_HOST        Redis 컨테이너의 네트워크와 이름
#   CORE_ENV_FILE                    Core 환경 변수 파일(JWT 등). 그 안의 DB·Redis 주소는 아래 environment가 덮어쓴다
#   CORE_DB                          DB 이름(기본 ticket)
#
# 이미지는 build/libs의 bootJar로 만든다. 먼저 .\gradlew.bat bootJar를 실행한다.
#   docker compose --env-file compose.local.env -f compose.local.yml up -d --build --wait
services:
  core:
    build: .
    image: ticket-core:local
    container_name: ticket-core-local
    env_file: ${CORE_ENV_FILE:?set CORE_ENV_FILE in compose.local.env}
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:?}:5432/${CORE_DB:-ticket}?reWriteBatchedInserts=true
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:?}
      SPRING_DATA_REDIS_PORT: "6379"
      # SQL 로그(p6spy)는 측정을 느리게 하므로 끈다. reset-local.ps1과 같은 조건이다.
      DECORATOR_DATASOURCE_ENABLED: "false"
      # Clock은 Asia/Seoul로 고정돼 있지만 JPA 감사 시각은 JVM 기본 시간대를 따른다.
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${CORE_PORT:-8083}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [postgres, redis]

networks:
  postgres:
    name: ${POSTGRES_NETWORK:?}
    external: true
  redis:
    name: ${REDIS_NETWORK:?}
    external: true
