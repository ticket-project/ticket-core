plugins {
    id 'java-test-fixtures'
}

dependencies {
    implementation project(':core:core-domain')
    implementation project(':support:error')

    // 유스케이스에 필요한 최소 Spring만 쓴다. web, security, 메시징, Spring Data는 두지 않는다.
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-core'
    implementation 'org.springframework:spring-beans'
    // 로깅 파사드만 쓴다. 구현은 실행 모듈이 고른다.
    implementation 'org.slf4j:slf4j-api'

    testImplementation libs.fixture.monkey.starter
    testImplementation libs.archunit.junit5
    // 제약 위반 원인 예외를 실제 타입으로 만들어 테스트한다. 프로덕션은 쓰지 않는다.
    testImplementation 'org.hibernate.orm:hibernate-core'
    testImplementation(testFixtures(project(':core:core-app')))

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}
