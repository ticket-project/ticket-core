plugins {
    id 'java-test-fixtures'
}

dependencies {
    implementation project(':support:error')

    // 엔티티 매핑에 필요한 JPA 애노테이션.
    implementation 'jakarta.persistence:jakarta.persistence-api'
    // 빈 선언(@Component, @Service)만 쓴다.
    implementation 'org.springframework:spring-context'
    // BaseEntity의 생성·수정 감사 컬럼에만 Spring Data auditing을 쓴다.
    implementation 'org.springframework.data:spring-data-jpa'
    // Querydsl Q 타입은 엔티티가 있는 이 모듈에서 생성된다. 조회 구현은 core-infra가 한다.
    implementation "com.querydsl:querydsl-jpa:5.1.0:jakarta"

    testRuntimeOnly 'com.h2database:h2'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    testFixturesImplementation "com.querydsl:querydsl-jpa:5.1.0:jakarta"
    testFixturesRuntimeOnly 'com.h2database:h2'

    testImplementation("com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.15")
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
}
