dependencies {
    implementation project(':core:core-app')
    implementation project(':support:error')
    implementation project(':support:logging')

    // HTTP adapter 구현에 필요한 의존성만 둔다. 실행 환경 의존성은 bootstrap이 소유한다.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'

    // 프로덕션 코드는 core-domain을 보지 않는다. 계약 테스트가 도메인 픽스처를 쓸 때만 허용한다.
    testImplementation project(':core:core-domain')
    testImplementation project(':core:core-infra')
    testImplementation("com.navercorp.fixturemonkey:fixture-monkey-starter:1.1.15")
    testImplementation 'org.springframework.boot:spring-boot-security-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}
