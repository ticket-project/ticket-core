spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        use_sql_comments: true
        show_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-vendor/oracle
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: "1"
    baseline-description: existing schema before Flyway
    clean-disabled: true
  modulith:
    runtime:
      # CI의 ModularityTests가 배포 전 gate를 이미 통과시켰다. production 기동에서 같은 검증을
      # 다시 돌리면 시작 시간만 늘어나므로 끈다. local/test/dev에서는 켠다.
      verification-enabled: false
decorator:
  datasource:
    p6spy:
      enable-logging: false

app:
  seed:
    enabled: false
  auth:
    oauth2-success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:https://oneticket.site/auth/callback}
    oauth2-failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:https://oneticket.site/auth/callback}
