spring:
  datasource:
    url: jdbc:h2:file:~/ticket-local;MODE=Oracle;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
  flyway:
    enabled: false
  modulith:
    runtime:
      # CI의 ModularityTests가 권위 있는 gate다. 이 profile은 로컬 기동 시 추가로 한 번 더
      # 구조를 검증해 배포 전에 문제를 조기에 드러낸다. production에서는 끈다(application-prod.yml).
      verification-enabled: true

# 초기 데이터는 기동 시 자동으로 들어가지 않는다. 서버 기동이 끝난 뒤
# `.\gradlew.bat seedLocal`을 따로 실행한다 -- 자세한 내용은 seed/README.md.
app:
  auth:
    oauth2-success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/callback}
    oauth2-failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/auth/callback}
