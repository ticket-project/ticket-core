spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ticket}
    username: ${SPRING_DATASOURCE_USERNAME:ticket}
    password: ${SPRING_DATASOURCE_PASSWORD:ticket_local}
    driver-class-name: org.postgresql.Driver

  # 스키마는 운영과 같은 Flyway migration으로 만든다. entity만 바꾸고 migration을 빠뜨리면 여기서 기동이 실패한다.
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration-vendor/postgresql
  modulith:
    runtime:
      # CI의 ModularityTests가 권위 있는 gate다. 이 profile은 로컬 기동 시 추가로 한 번 더
      # 구조를 검증해 배포 전에 문제를 조기에 드러낸다. production에서는 끈다(application-prod.yml).
      verification-enabled: true

# SQL 로그(p6spy). 기본은 꺼져 있다(application.yml).
decorator:
  datasource:
    enabled: true

# 초기 데이터는 기동 시 자동으로 들어가지 않는다. 서버 기동이 끝난 뒤
# `.\gradlew.bat seedLocal`을 따로 실행한다 -- 자세한 내용은 seed/README.md.
app:
  auth:
    oauth2-success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/callback}
    oauth2-failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/auth/callback}
