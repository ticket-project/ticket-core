spring:
  datasource:
    url: jdbc:h2:file:~/ticket-local;MODE=Oracle;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-vendor/h2
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: "1"
    baseline-description: existing local schema before Flyway
  modulith:
    runtime:
      # local/test와 함께 pre-production 환경(docs/operations.md의 dev)까지는 켠다.
      # CI의 ModularityTests가 권위 있는 gate이며, production만 끈다(application-prod.yml).
      verification-enabled: true

app:
  auth:
    oauth2-success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/callback}
    oauth2-failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:3000/auth/callback}
