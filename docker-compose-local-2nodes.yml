# Core 두 대와 앞단 nginx를 로컬에 띄운다. docker-compose-local.yml에 덧붙여 쓴다(스케일 아웃 결정 D3-3 전 검증).
#
#   .\gradlew.bat bootJar
#   docker compose -f docker-compose-local.yml -f docker-compose-local-2nodes.yml up -d --build --wait
#
# - 요청은 nginx(127.0.0.1:8085)가 두 Core에 번갈아 보낸다. sticky는 없다(운영 ALB 결정 D1-2와 같다).
# - 지표는 Core마다 따로 읽는다: ticket-core 127.0.0.1:8083, ticket-core-2 127.0.0.1:8084.
#   gatling-test run-step.ps1은 -CoreUrl http://127.0.0.1:8085 -MetricsUrl "http://127.0.0.1:8083,http://127.0.0.1:8084".
# - 한 PC에서 두 대가 CPU를 나눠 쓴다. 대수를 늘린 처리량 비교가 아니라 두 대에서 기능이 깨지지 않는지를 본다.
name: ticket

services:
  core-2:
    extends:
      file: docker-compose-local.yml
      service: core
    container_name: ticket-core-2
    ports: !override
      - "127.0.0.1:8084:8080"

  core-lb:
    image: nginx:1.27-alpine
    container_name: ticket-core-lb
    depends_on:
      core:
        condition: service_healthy
      core-2:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:80"
    configs:
      - source: core-lb
        target: /etc/nginx/nginx.conf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

configs:
  core-lb:
    # compose가 ${}를 변수로 읽으므로 nginx 변수의 $는 $$로 적는다.
    content: |
      worker_processes auto;
      events { worker_connections 8192; }
      http {
        upstream core {
          server core:8080;
          server core-2:8080;
          keepalive 128;
        }
        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      '';
        }
        access_log off;
        server {
          listen 80;
          location / {
            proxy_pass http://core;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            # Core는 X-Forwarded-*로 외부 주소를 정한다(server.forward-headers-strategy: framework). Proto만 주면 포트가
            # 기본값(80)으로 돌아가 WebSocket 출처 검사가 Origin(127.0.0.1:8085)과 다르게 보고 403을 낸다. 포트가 붙은
            # Host를 그대로 넘긴다(운영 ALB는 X-Forwarded-Port를 함께 보낸다).
            proxy_set_header Host $$http_host;
            proxy_set_header X-Forwarded-Host $$http_host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_read_timeout 60s;
          }
        }
      }
